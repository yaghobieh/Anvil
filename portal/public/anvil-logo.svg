<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="anvilGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="50%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#A855F7"/>
    </linearGradient>
    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#94A3B8"/>
      <stop offset="50%" style="stop-color:#64748B"/>
      <stop offset="100%" style="stop-color:#475569"/>
    </linearGradient>
    <linearGradient id="sparkGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FCD34D"/>
      <stop offset="100%" style="stop-color:#F97316"/>
    </linearGradient>
  </defs>

  <rect x="10" y="58" width="80" height="12" rx="2" fill="url(#metalGradient)"/>

  <path d="M20 45 L80 45 L85 58 L15 58 Z" fill="url(#anvilGradient)"/>

  <rect x="35" y="30" width="30" height="15" rx="2" fill="url(#metalGradient)"/>

  <rect x="42" y="15" width="16" height="18" rx="1" fill="url(#anvilGradient)"/>

  <rect x="25" y="70" width="50" height="15" rx="3" fill="url(#metalGradient)"/>

  <circle cx="25" cy="25" r="4" fill="url(#sparkGradient)">
    <animate attributeName="opacity" values="1;0.3;1" dur="0.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="75" cy="20" r="3" fill="url(#sparkGradient)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="0.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="85" cy="35" r="2" fill="url(#sparkGradient)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1s" repeatCount="indefinite"/>
  </circle>

  <path d="M18 20 L22 15 M20 22 L25 20" stroke="url(#sparkGradient)" stroke-width="2" stroke-linecap="round">
    <animate attributeName="opacity" values="1;0.2;1" dur="0.5s" repeatCount="indefinite"/>
  </path>
</svg>

